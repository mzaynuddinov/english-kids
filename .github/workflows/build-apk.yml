name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: english-kids-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android .

      - name: Configure Android manifest
        run: python3 -c "from pathlib import Path; p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text(encoding='utf-8'); perms='    <uses-permission android:name=\\\"android.permission.POST_NOTIFICATIONS\\\" />\\n    <uses-permission android:name=\\\"android.permission.SCHEDULE_EXACT_ALARM\\\" />\\n    <uses-permission android:name=\\\"android.permission.WAKE_LOCK\\\" />\\n    <uses-permission android:name=\\\"android.permission.RECEIVE_BOOT_COMPLETED\\\" />\\n'; s=s.replace('<application ', perms+'<application ', 1) if 'android.permission.POST_NOTIFICATIONS' not in s else s; s=s.replace('android:label=\\\"english_kids\\\"','android:label=\\\"Англисиро Омӯз\\\"'); p.write_text(s,encoding='utf-8')"

      - name: Render launcher image
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          convert assets/logo.svg -background '#020617' -resize 1024x1024 assets/launcher.png

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-kids-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
