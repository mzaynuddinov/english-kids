name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: english-kids-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android .

      - name: Configure Android app identity and alarms
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          if 'android.permission.POST_NOTIFICATIONS' not in text:
              permissions = '''
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'''
              text = re.sub(r'(<manifest[^>]*>)', r'\1' + permissions, text, count=1)
          text = text.replace('android:label="english_kids"', 'android:label="Англисиро Омӯз"')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Render launcher image
        run: convert assets/logo.svg -background '#020617' -resize 1024x1024 assets/launcher.png

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze


      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-kids-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
