name: english_kids
description: Англисиро Омӯз — барномаи муосири омӯзиши англисӣ барои кӯдакони тоҷик.
publish_to: "none"
version: 2.4.7+32

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.3
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  url_launcher: ^6.3.1
  image: ^4.5.4
  image_picker: ^1.1.2
  pdf: ^3.11.3
  share_plus: 10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - data/vocabulary.json
    - assets/logo.png
    - assets/developer.png
    - assets/fonts/NotoSans-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#083344"
  adaptive_icon_foreground: assets/logo.png
  adaptive_icon_foreground_inset: 8

flutter_native_splash:
  color: "#F8FAFC"
  image: assets/logo.png
  android_12:
    color: "#F8FAFC"
    image: assets/logo.png
  android: true
  ios: false
  web: false
